<svg id="tsvg" viewBox="0 0 380 450" role="img" aria-label="Cross section of the Tahoe Basin from the lake floor at 4,580 feet to Freel Peak at 10,881 feet, with habitat zones as colored bands">
      <defs>
        <clipPath id="land"><path d="M58,250 L96,316.6 C110,380 130,418.8 160,418.8 C195,418.8 215,370 232,316.6 L256,313 L330,27.4 L352,70 L380,110 L380,450 L58,450 Z"/></clipPath>
        <clipPath id="water"><path d="M96,316.6 C110,380 130,418.8 160,418.8 C195,418.8 215,370 232,316.6 Z"/></clipPath>
      </defs>
      <g clip-path="url(#land)">
        <rect class="band" data-z="A" x="58" y="0" width="322" height="82.1" fill="var(--z-alpine)"/>
        <rect class="band" data-z="S" x="58" y="82.1" width="322" height="124.3" fill="var(--z-sub)"/>
        <rect class="band" data-z="M" x="58" y="206.4" width="322" height="110.2" fill="var(--z-mont)"/>
        <rect x="58" y="316.6" width="322" height="134" fill="var(--rock)"/>
      </g>
      <g clip-path="url(#water)">
        <rect class="band" data-z="D" x="90" y="345" width="150" height="80" fill="var(--z-deep)"/>
        <rect class="band" data-z="O" x="118" y="316.6" width="94" height="28.4" fill="var(--z-open)"/>
        <rect class="band" data-z="N" x="90" y="316.6" width="28" height="28.4" fill="var(--z-near)"/>
        <rect class="band" data-z="N" x="212" y="316.6" width="28" height="28.4" fill="var(--z-near)"/>
      </g>
      <path class="band" data-z="W" d="M232,316.6 L256,313" stroke="var(--z-wet)" stroke-width="7" stroke-linecap="round" fill="none"/>
      <g stroke="var(--muted)" stroke-width=".6" stroke-dasharray="2 3" opacity=".7" fill="none">
        <path d="M58,27.4H330"/><path d="M58,82.1H316"/><path d="M58,206.4H284"/><path d="M58,316.6H96"/><path d="M58,418.8H160"/>
      </g>
      <path d="M58,10V440" stroke="var(--muted)" stroke-width="1" fill="none"/>
      <g class="tick" text-anchor="end">
        <text x="52" y="31">10,881</text><text x="52" y="86">10,000</text><text x="52" y="210">8,000</text><text x="52" y="320">6,225</text><text x="52" y="422">4,580</text>
        <text x="52" y="446">ft</text>
      </g>
      <text class="lab" x="330" y="17" text-anchor="middle">Freel Peak</text>
      <text x="165" y="388" text-anchor="middle" font-family="var(--mono)" font-size="10.5" fill="var(--on-water)">1,645 ft deep</text>
    </svg>
